apiVersion: rke-machine-config.cattle.io/v1
kind: HarvesterConfig
metadata:
  name: hhg-k3s-harvester-pool
  namespace: fleet-default
# Namespace within Harvester where VMs are scheduled
vmNamespace: default
cpuCount: "2"
memorySize: "4"
#  default/image-8pgjc leap-16.0
# default/image-xxsqt leap-15.6
diskInfo: |
  {
    "disks": [
      {
        "imageName": "default/image-xxsqt",
        "bootOrder": 1,
        "size": 40
      }
    ]
  }
networkInfo: |
  {
    "interfaces": [
      {
        "networkName": "default/net66"
      }
    ]
  }
sshUser: demo
userData: |
  #cloud-config
  user: demo
  password: password
  chpasswd: { expire: False }
  ssh_pwauth: True
  package_update: true
  packages:
    - qemu-guest-agent
  runcmd:
    - systemctl enable --now qemu-guest-agent